<div class="flex h-screen bg-gray-100 overflow-hidden relative">

  <div *ngIf="sidebarOpen" (click)="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-20 sm:hidden"></div>

  <div
    class="w-64 bg-white flex flex-col items-center py-4 z-30 absolute sm:relative h-full transition-transform duration-300 ease-in-out"
    [ngClass]="{'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen, 'sm:translate-x-0': true}">

    <div class="mb-2">
      <img src="Logo_BiblioTech.png" alt="Logo" class="h-20 w-auto object-contain" width="160" height="80">
    </div>
    <div class="text-lg font-bold text-brand-500 text-center mb-6 leading-tight">BiblioTech</div>

    <div class="w-full px-4 mt-2 flex flex-col gap-2 overflow-y-auto pb-6">

      <a routerLink="/inicio"
        class="flex items-center gap-3 px-4 py-2.5 rounded-2xl cursor-pointer hover:bg-gray-100 transition-colors text-gray-800 font-semibold text-sm"
        routerLinkActive="bg-gray-100" [routerLinkActiveOptions]="{exact: true}">
        <lucide-icon name="home" class="w-5 h-5 text-gray-500"></lucide-icon>
        <span>Inicio</span>
      </a>

      <div class="flex flex-col gap-1">
        <div (click)="toggleGroup(1)"
          class="flex items-center justify-between px-4 py-2.5 rounded-2xl cursor-pointer hover:bg-gray-100 transition-colors"
          [ngClass]="{'bg-gray-100': activeGroups[1]}">
          <div class="flex items-center gap-3 text-gray-800 font-semibold text-sm">
            <lucide-icon name="layout-grid" class="w-5 h-5 text-gray-500"></lucide-icon>
            <span>Administración</span>
          </div>
          <lucide-icon [name]="activeGroups[1] ? 'chevron-up' : 'chevron-down'"
            class="w-4 h-4 text-gray-500"></lucide-icon>
        </div>

        <div *ngIf="activeGroups[1]" class="relative flex flex-col ml-6 gap-1 py-1">
          <div class="absolute left-[9px] top-0 bottom-4 w-px bg-gray-200"></div>

          <a routerLink="/gestion-usuarios"
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Gestión de Usuarios
          </a>
          <a
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Opción 2........
          </a>
          <a
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Opción N........
          </a>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <div (click)="toggleGroup(2)"
          class="flex items-center justify-between px-4 py-2.5 rounded-2xl cursor-pointer hover:bg-gray-100 transition-colors"
          [ngClass]="{'bg-gray-100': activeGroups[2]}">
          <div class="flex items-center gap-3 text-gray-800 font-semibold text-sm">
            <lucide-icon name="box" class="w-5 h-5 text-gray-500"></lucide-icon>
            <span>More Options</span>
          </div>
          <lucide-icon [name]="activeGroups[2] ? 'chevron-up' : 'chevron-down'"
            class="w-4 h-4 text-gray-500"></lucide-icon>
        </div>

        <div *ngIf="activeGroups[2]" class="relative flex flex-col ml-6 gap-1 py-1">
          <div class="absolute left-[9px] top-0 bottom-4 w-px bg-gray-200"></div>

          <a
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Opción 1........
          </a>
          <a
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Opción 2........
          </a>
          <a
            class="relative flex items-center px-4 py-2 text-gray-500 hover:text-gray-800 font-medium text-sm rounded-2xl hover:bg-gray-100 transition-colors ml-[26px]">
            <div
              class="absolute -left-[17px] top-1/2 w-4 border-b border-l border-gray-200 rounded-bl-lg h-10 -translate-y-full">
            </div>
            Opción N........
          </a>
        </div>
      </div>

    </div>
  </div>

  <div class="flex flex-col flex-1 overflow-hidden w-full h-full">

    <div class="bg-white border-b-2 border-gray-300 px-4 py-3 flex justify-between items-center shadow-sm z-10">

      <div class="flex-1 flex items-center">
        <button class="sm:hidden text-gray-600 focus:outline-none hover:text-brand-400 transition-colors"
          (click)="toggleSidebar()">
          <lucide-icon name="menu" class="w-6 h-6"></lucide-icon>
        </button>
      </div>

      <div class="flex-1 text-center text-xs text-gray-600 font-bold uppercase tracking-wide">
        {{ fechaLiteral }} / {{saludos}}
      </div>

      <div class="flex-1 flex justify-end items-center gap-4">
        <select
          class="border border-gray-400 rounded px-2 py-1 text-sm bg-gray-50 focus:outline-none focus:border-brand-400">
          <option>Rol 1</option>
          <option>Rol 2</option>
          <option>Rol 3</option>
        </select>

        <div class="relative group ">

          <div *ngIf="showMenu" class="fixed inset-0 z-40" (click)="showMenu = false"></div>

          <div class="relative inline-block cursor-pointer" (click)="toggleUserMenu()">
            <img [src]="getFotoUrl()" alt="Avatar"
              class="w-10 h-10 rounded-full border-2 border-brand-400 object-cover bg-gray-200 shadow-sm relative z-40">
          </div>

          <div *ngIf="showMenu"
            class="absolute right-0 mt-2 w-80 bg-white border border-gray-200 rounded-lg shadow-xl overflow-hidden z-40 flex flex-col cursor-default"
            (click)="$event.stopPropagation()">
            <div class="flex flex-row p-6 border-b border-gray-200 bg-gray-50 items-center">

              <div
                class="relative w-24 h-24 rounded overflow-hidden border-2 border-gray-300 shadow-sm mr-4 flex-shrink-0 group/foto">
                <img [src]="getFotoUrl()" alt="Avatar" class="w-full h-full object-cover bg-gray-200">
                <a *ngIf="usuario" routerLink="/modificar-fotos" (click)="toggleUserMenu()"
                  class="absolute bottom-0 left-0 right-0 h-8 bg-black bg-opacity-60 flex items-center justify-center text-white text-xs opacity-0 group-hover/foto:opacity-100 transition-opacity cursor-pointer">
                  Modificar foto
                </a>
              </div>

              <div class="flex flex-col justify-center items-center flex-1 h-full">
                <div class="text-base font-bold text-gray-800 text-center break-words w-full">
                  {{ usuario ? usuario.user : 'Invitado' }}
                </div>
              </div>
            </div>

            <div class="p-4 flex justify-center bg-white">
              <button *ngIf="usuario" (click)="logout(); toggleUserMenu()"
                class="w-full bg-brand-400 text-white px-6 py-2 rounded shadow hover:bg-brand-300 text-sm font-medium transition-colors flex items-center justify-center gap-2">
                <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
                Desconectar
              </button>
              <button *ngIf="!usuario" (click)="openLogin()"
                class="w-full bg-brand-400 text-white px-6 py-2 rounded shadow hover:bg-brand-300 text-sm font-medium transition-colors flex items-center justify-center gap-2">
                <lucide-icon name="log-in" class="w-4 h-4"></lucide-icon>
                Conectarse
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="flex-1 bg-gray-200 relative overflow-hidden flex flex-col w-full h-full">
      <div class="w-full h-full flex items-stretch justify-stretch bg-gray-200 relative">
        <div class="w-full h-full overflow-auto">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>

  </div>

  <app-login *ngIf="showLoginModal" (closeModal)="handleLoginClose($event)"></app-login>
</div>
