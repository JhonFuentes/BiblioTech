<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 transition-opacity">
  <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl w-11/12 max-w-md border border-white/50 relative">
    <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-6">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-[#E3F6F5] flex items-center justify-center text-[#3E6D9C]">
          <lucide-icon name="log-in" class="w-5 h-5"></lucide-icon>
        </div>
        <h2 class="text-xl font-bold text-[#2A2F63] m-0">Conexión al Sistema</h2>
      </div>
      <button type="button" (click)="onCancel()" class="text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-600 mb-2">Usuario: <span class="text-red-500 font-bold">*</span></label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex items-center justify-center"><lucide-icon name="user" class="w-4 h-4"></lucide-icon></span>
          <input type="text" [(ngModel)]="loginData.login" name="login" required placeholder="Ingrese su usuario"
                 class="w-full pl-10 pr-4 py-2.5 bg-white/90 border border-slate-300 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-[#3E6D9C] focus:ring-2 focus:ring-[#3E6D9C]/20">
        </div>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-600 mb-2">Password: <span class="text-red-500 font-bold">*</span></label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex items-center justify-center"><lucide-icon name="lock" class="w-4 h-4"></lucide-icon></span>
          <input type="password" [(ngModel)]="loginData.password" name="password" required placeholder="••••••••"
                 class="w-full pl-10 pr-4 py-2.5 bg-white/90 border border-slate-300 rounded-lg text-sm text-slate-700 focus:outline-none focus:border-[#3E6D9C] focus:ring-2 focus:ring-[#3E6D9C]/20">
        </div>
      </div>
      
      <div class="bg-red-50 border border-red-200 text-red-600 text-xs font-semibold rounded-xl p-3 text-center mb-4 flex items-center justify-center gap-2" *ngIf="error">
        <lucide-icon name="alert-circle" class="w-4 h-4 shrink-0"></lucide-icon>
        <span>{{ error }}</span>
      </div>

      <div class="flex justify-end gap-3 mt-6 pt-2">
        <button type="submit" class="bg-[#3E6D9C] hover:bg-[#5FB0C9] text-white font-semibold text-sm py-2.5 px-6 rounded-xl shadow-md transition-all hover:-translate-y-0.5 cursor-pointer">
          Aceptar
        </button>
        <button type="button" (click)="onCancel()" class="bg-slate-100/80 hover:bg-slate-200 border border-slate-300 text-slate-600 font-semibold text-sm py-2.5 px-6 rounded-xl transition-all cursor-pointer">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
