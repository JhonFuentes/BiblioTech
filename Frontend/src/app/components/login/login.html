<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm border border-gray-300 relative">
    <h2 class="text-lg font-semibold border-b border-gray-200 pb-3 mb-4 text-brand-500">Conexión al sistema..</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario:</label>
        <input type="text" [(ngModel)]="loginData.login" name="login" required 
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-400">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" required 
               class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-brand-400">
      </div>
      
      <div class="text-red-500 text-sm text-center mb-4" *ngIf="error">{{ error }}</div>

      <div class="flex justify-center gap-4 mt-6">
        <button type="submit" class="bg-brand-400 hover:bg-brand-300 text-white py-2 px-6 rounded shadow transition">Aceptar</button>
        <button type="button" (click)="onCancel()" class="bg-gray-400 hover:bg-gray-500 text-white py-2 px-6 rounded shadow transition">Cancelar</button>
      </div>
    </form>
  </div>
</div>
